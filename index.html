<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Saniul Ahmed</title>
	<style>
		:root {
			--bg: #fff;
			--text: #111;
			--muted: #666;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #111;
				--text: #eee;
				--muted: #999;
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			min-height: 100dvh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			-webkit-font-smoothing: antialiased;
			text-align: center;
		}

		img {
			width: 128px;
			height: 128px;
			border-radius: 50%;
			object-fit: cover;
		}

		h1 {
			margin: 20px 0 12px;
			font-size: 28px;
			font-weight: 600;
			letter-spacing: -0.01em;
		}

		nav {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 4px 20px;
		}

		a {
			color: var(--muted);
			text-decoration: none;
		}

		a:hover,
		a:focus-visible {
			color: var(--text);
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<main>
		<img src="/static/images/avatar.jpg" alt="Saniul Ahmed" width="128" height="128">
		<h1>Saniul Ahmed</h1>
		<nav>
			<a href="https://github.com/saniul">GitHub</a>
			<a href="https://twitter.com/saniul">Twitter</a>
			<a href="mailto:saniul.ahmed@gmail.com">Email</a>
			<a href="https://www.linkedin.com/in/saniul">LinkedIn</a>
		</nav>
	</main>
</body>
</html>
